<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Exam | Examify</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="exam-page">
  <header class="exam-header">
    <div class="container exam-header-inner">
      <a class="brand" href="index.html"><span class="brand-mark">E</span> Examify</a>
      <div class="exam-title"><span id="examName">Loading...</span><small id="questionCounter"></small></div>
      <div class="timer-box"><span>⏱</span><strong id="timer">00:00</strong></div>
    </div>
  </header>

  <main class="exam-main">
    <div class="container exam-layout">
      <section class="question-panel">
        <div class="question-meta"><span id="difficultyBadge" class="badge">Medium</span><span id="questionNumber"></span></div>
        <div class="question-progress"><span id="questionProgress"></span></div>
        <h1 id="questionText">Loading question...</h1>
        <div id="options" class="options"></div>
        <div class="exam-actions">
          <button id="prevBtn" class="btn btn-ghost">← Previous</button>
          <button id="nextBtn" class="btn btn-primary">Next →</button>
          <button id="submitBtn" class="btn btn-submit">Submit Exam</button>
        </div>
      </section>
      <aside class="question-nav">
        <h3>Question Palette</h3>
        <p>Click a number to jump to a question.</p>
        <div id="palette" class="palette"></div>
        <div class="legend"><span><i class="answered"></i> Answered</span><span><i></i> Unanswered</span></div>
        <div class="exam-note"><strong>Tip</strong><p>You can change your answers anytime before submitting.</p></div>
      </aside>
    </div>
  </main>

  <div id="confirmModal" class="modal">
    <div class="modal-card">
      <div class="modal-icon">?</div>
      <h2>Submit your exam?</h2>
      <p id="submitSummary">You can review your answers before submitting.</p>
      <div class="modal-actions"><button id="cancelSubmit" class="btn btn-ghost">Continue Exam</button><button id="confirmSubmit" class="btn btn-primary">Submit Now</button></div>
    </div>
  </div>

  <script src="js/data.js"></script>
  <script src="js/exam.js"></script>
</body>
</html>
